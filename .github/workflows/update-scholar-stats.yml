name: Update Google Scholar Data

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Update Scholar stats
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_scholar_stats.py
      - name: Update Scholar publications
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_scholar_publications.py
        continue-on-error: true
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar.yml data/publications.yml
          if ! git diff --cached --quiet; then
            git commit -m "data: update Google Scholar data"
            git push
          fi
