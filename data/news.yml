items:
  - date: "2025-08-01"
    display_date: "08/2025"
    text: "Dr. Chenggang Wang has received the \"Best Reviewer\" award from the IEEE IRI 2025 conference, congrats!"
  - date: "2025-06-03"
    display_date: "06/2025"
    text: "Our proposal \"Catalyst OU: A Pilot for an LLM-Powered Researcher Collaboration Network\" submitted to OU Summer AI Pilot Projects has been selected for funding. Thanks OU for the support!"
  - date: "2025-06-02"
    display_date: "06/2025"
    text: "Our proposal \"Establishing a High-Performance Local AI Development Platform: Empowering the University of Oklahoma with Secure and Efficient On-Premises LLM Capabilities\" submitted to OU Summer AI Pilot Projects has been selected for funding. Thanks OU for the support!"
  - date: "2025-06-01"
    display_date: "06/2025"
    text: "One paper is accepted by IEEE IRI 2025 conference, congrats!"
  - date: "2025-05-01"
    display_date: "05/2025"
    text: "Dr. Chenggang Wang has served as the TPC and session chair at IEEE IRI 2025 conference."
  - date: "2024-08-01"
    display_date: "08/2024"
    text: "Dr. Chenggang Wang joined the Polytechnic Institute at the University of Oklahoma"
  - date: "2023-02-01"
    display_date: "02/2023"
    text: "One paper is accepted by ACM WiSec 2023, congrats!"
  - date: "2023-01-01"
    display_date: "01/2023"
    text: "Dr. Wang join Auburn University at Montgomery (AUM) as Assistant Professor."
