<header class="site-header">
  <div class="site-header-inner">
    <a class="site-identity" href="/" aria-label="Chenggang Wang home">
      <span class="site-identity-mark" aria-hidden="true">CW</span>
      <span class="site-identity-name">Chenggang Wang</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="site-nav-link{{ if or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }} is-active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
